services:
  ngrok:
    image: ngrok/ngrok:latest
    command: >
      start --all --config /etc/ngrok.yml --authtoken ${NGROK_AUTH_TOKEN} --log stdout
    environment:
      - NGROK_AUTHENTICATION_TOKEN=${NGROK_AUTH_TOKEN}
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    ports:
      - "4040:4040"   # ngrok web UI needed
