databaseChangeLog:
  - changeSet:
      id: create-password-reset-tokens
      author: veeshal
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: app_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: smallint
                  constraints:
                      nullable: false
        - addForeignKeyConstraint:
            constraintName: password_reset_tokens_app_user_id_fk
            baseTableName: password_reset_tokens
            baseColumnNames: app_user_id
            referencedTableName: app_user
            referencedColumnNames: id
            onDelete: CASCADE
