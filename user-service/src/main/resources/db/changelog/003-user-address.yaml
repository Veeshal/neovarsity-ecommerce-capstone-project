databaseChangeLog:
  - changeSet:
      id: 001-create-user-address-table
      author: veeshal
      changes:
        - createTable:
            tableName: user_address
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_address_user
                    referencedTableName: app_user
                    referencedColumnNames: id

              - column:
                  name: address_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: address_line1
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: address_line2
                  type: VARCHAR(255)

              - column:
                  name: city
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: state
                  type: VARCHAR(100)

              - column:
                  name: postal_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: country
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: phone_number
                  type: VARCHAR(20)

              - column:
                  name: latitude
                  type: double

              - column:
                  name: longitude
                  type: double

              - column:
                  name: is_default
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - createIndex:
            tableName: user_address
            indexName: idx_user_address_user_id
            columns:
              - column:
                  name: user_id
