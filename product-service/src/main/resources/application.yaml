server:
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true
  shutdown: graceful
  servlet:
    context-path: /api

spring:
  profiles:
    active: bonsai


  application:
    name: product-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecom-product}?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    change-log: classpath:/db/master.yaml
    enabled: true
  jpa:
    show-sql: true
  output:
    ansi:
      enabled: always
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8000}
          jwk-set-uri: ${AUTH_JWK_ISSUER_URI:http://localhost:8000/user-service/api}/.well-known/jwks.json
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD:password}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: true
    properties:
      security.protocol: SSL
      ssl.truststore.type: PEM
      ssl.truststore.location: ${KAFKA_TRUSTSTORE_PATH}
      ssl.keystore.type: PEM
      ssl.keystore.location: ${KAFKA_KEYSTORE_PATH}

kafka:
  topic:
    order-completed: order.completed

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.boot.autoconfigure: off
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.hibernate.orm.connections.pooling: off
    org.springframework.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: local
  kafka:
    properties:
      security.protocol: PLAINTEXT