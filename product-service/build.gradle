tasks.register('dockerBuild', Exec) {
    group = 'docker'
    description = 'Builds the Docker image for the product-service'
    commandLine 'docker', 'build', '-t', "ghcr.io/veeshal/neovarsity-product-service:${version}", '.'
    dependsOn build
}
