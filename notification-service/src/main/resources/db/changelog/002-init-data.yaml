databaseChangeLog:
  - changeSet:
      id: init-email-templates
      author: vishal
      changes:
        - insert:
            tableName: email_template
            columns:
            - column:
                name: template_name
                value: WELCOME
            - column:
                name: version
                valueNumeric: "1"
            - column:
                name: subject
                value: "Welcome to E-Commerce Platform!"
            - column:
                name: body
                value: |
                    Dear {{firstName}},

                    Welcome to our E-Commerce Platform! We're thrilled to have you on board.

                    Happy Shopping!
            - column:
                name: created_by
                valueNumeric: "1"
        - insert:
            tableName: email_template
            columns:
            - column:
                name: template_name
                value: PASSWORD_RESET
            - column:
                name: version
                valueNumeric: "1"
            - column:
                name: subject
                value: "Password Reset Request"
            - column:
                name: body
                value: |
                    Dear {{firstName}},

                    We received a request to reset your password. Use the OTP below to set a new password:

                    {{otp}}

                    If you did not request a password reset, please ignore this email.
            - column:
                name: created_by
                valueNumeric: "1"
        - insert:
            tableName: email_template
            columns:
            - column:
                name: template_name
                value: ORDER_CONFIRMATION
            - column:
                name: version
                valueNumeric: "1"
            - column:
                name: subject
                value: "Your Order {{orderId}} Confirmation"
            - column:
                name: body
                value: |
                    Dear {{firstName}},

                    Thank you for your order {{orderId}} placed on {{orderDate}}. We are processing it and will notify you once it's shipped.

                    Thank you for shopping with us!
            - column:
                name: created_by
                valueNumeric: "1"
