databaseChangeLog:
  - changeSet:
      id: 001-create-order-status
      author: veeshal
      changes:
        - createTable:
            tableName: order_status
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
        - insert:
            tableName: order_status
            columns:
              - column:
                  name: status
                  value: "PENDING"
        - insert:
            tableName: order_status
            columns:
              - column:
                  name: status
                  value: "PAID"
        - insert:
            tableName: order_status
            columns:
              - column:
                  name: status
                  value: "SHIPPED"
        - insert:
            tableName: order_status
            columns:
              - column:
                  name: status
                  value: "DELIVERED"
        - insert:
            tableName: order_status
            columns:
              - column:
                  name: status
                  value: "CANCELLED"

  - changeSet:
      id: 002-create-orders
      author: veeshal
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: status_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_orders_status
                    references: order_status(id)
              - column:
                  name: total_amount
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP"

  - changeSet:
      id: 003-create-order-items
      author: veeshal
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_items_order
                    references: orders(id)
                    deleteCascade: true
              - column:
                  name: product_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
